name: test

on:
  pull_request:
  push:

jobs:
  renderer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --project scripts --locked
      - run: uv run --project scripts python -m playwright install --with-deps chromium
      - run: uv run --project scripts python scripts/test_renderer.py
      - run: uv run --project scripts python scripts/test_mcp_payload.py
