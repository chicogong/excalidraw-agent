name: test

on:
  pull_request:
  push:

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project scripts --locked
      - run: uv run --project scripts playwright install --with-deps chromium
      - run: uv run --project scripts python scripts/test_renderer.py
      - run: uv run --project scripts python scripts/test_mcp_payload.py
